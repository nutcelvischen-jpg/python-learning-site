  - 🎯 第 8 章 - 實戰專案:
      - 8.1 空氣品質分析: chapter08_projects/01-air-quality.md
      - 8.2 銷售儀表板: chapter08_projects/02-sales-dashboard.md
      - 8.3 Threads 文字探勘: chapter08_projects/03-threads-mining.md
      - 8.4 環境經濟學個案: chapter08_projects/04-env-econ.md
      - 🆕 8.5 空汙 × 房價實戰: chapter08_projects_extra/05-air-vs-house.md

  - 🚀 第 9 章 - 進階導讀:
      - 9.1 機器學習路徑: chapter09_advanced/01-ml-path.md
      - 9.2 進階爬蟲: chapter09_advanced/02-crawling.md
      - 9.3 部署與分享: chapter09_advanced/03-deploy.md

  - 📎 附錄:
      - A. 速查表: appendix/A-cheatsheet.md
      - B. 常見錯誤 FAQ: appendix/B-errors-faq.md
      - C. 學習資源: appendix/C-resources.md
      - D. 術語中英對照: appendix/D-glossary.md
